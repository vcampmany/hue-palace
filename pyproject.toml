[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hue-palace"
version = "0.1.0"
description = "Turn Bluetooth/USB keyboards and BLE (BTHome) buttons into Philips Hue remotes, with a web status page"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiohue==4.9.1",
    "evdev==1.9.3",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "bleak>=1.0,<4",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
hue-palace = "hue_palace.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hue_palace = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
